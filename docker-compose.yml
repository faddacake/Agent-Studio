services:
  app:
    command: >
      sh -c "echo '[dev] Clearing stale Next.js cache...' && rm -rf apps/web/.next && pnpm turbo dev --filter=!@iterastudio/worker"
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${APP_PORT:-3001}:3000"
    environment:
      - REDIS_URL=redis://redis:6379
      - DATA_DIR=/data
      - TURBO_CACHE_DIR=/tmp/.turbo
      - NODE_ENV=development
      - HOME=/tmp
      - COREPACK_HOME=/tmp/corepack
    volumes:
      - .:/app
      - ./memory:/app/memory
      - /app/node_modules
      - /app/apps/web/node_modules
      - /app/packages/adapters/node_modules
      - /app/packages/crypto/node_modules
      - /app/packages/db/node_modules
      - /app/packages/engine/node_modules
      - /app/packages/shared/node_modules
      - /app/packages/worker/node_modules
      - app_data:/data
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/api/health').then(r=>{process.exit(r.ok?0:1)}).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 45s
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    command: pnpm --filter @iterastudio/worker dev
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - REDIS_URL=redis://redis:6379
      - DATA_DIR=/data
      - API_BASE_URL=http://app:3000
      - NODE_ENV=development
      - HOME=/tmp
      - COREPACK_HOME=/tmp/corepack
      - NODE_PATH=/app/node_modules/.pnpm/node_modules
    volumes:
      - .:/app
      - ./memory:/app/memory
      - /app/node_modules
      - /app/apps/web/node_modules
      - /app/packages/adapters/node_modules
      - /app/packages/crypto/node_modules
      - /app/packages/db/node_modules
      - /app/packages/engine/node_modules
      - /app/packages/shared/node_modules
      - /app/packages/worker/node_modules
      - app_data:/data
    depends_on:
      redis:
        condition: service_healthy
      app:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  app_data:
  redis_data:
